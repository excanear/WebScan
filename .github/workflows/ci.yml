name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch: {}

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.21'
      - name: Cache Go modules
        uses: actions/cache@v4
        with:
          path: ~/.cache/go-build
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
      - name: Install dependencies
        run: go mod download
      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v4
        with:
          version: v1.59.0
          args: run ./...

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.21'
      - name: Cache Go modules
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
      - name: Install dependencies
        run: go mod tidy
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test ./... -v -timeout 120s

  security:
    name: Security Scan (gosec)
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.21'
      - name: Install gosec
        run: go install github.com/securego/gosec/v2/cmd/gosec@latest
      - name: Run gosec
        run: gosec -exclude-dir=test ./...

  build:
    name: Build artifacts
    runs-on: ubuntu-latest
    needs: test
    strategy:
      matrix:
        os: [linux, windows, darwin]
        arch: [amd64]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.21'
      - name: Build
        run: |
          mkdir -p dist
          GOOS=${{ matrix.os }} GOARCH=${{ matrix.arch }} go build -ldflags="-s -w" -o dist/webscan-${{ matrix.os }}-${{ matrix.arch }} .
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: webscan-${{ matrix.os }}-${{ matrix.arch }}
          path: dist/webscan-${{ matrix.os }}-${{ matrix.arch }}

  integration:
    name: Integration (manual or PR)
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || github.event_name == 'pull_request' }}
    steps:
      - uses: actions/checkout@v4
      - name: Check PR label or dispatch
        id: check_label
        uses: actions/github-script@v6
        with:
          script: |
            const event = context.eventName;
            if (event === 'workflow_dispatch') {
              return true;
            }
            if (event === 'pull_request') {
              const pr = context.payload.pull_request;
              if (!pr || !pr.labels) return false;
              const labels = pr.labels.map(l => l.name);
              return labels.includes('run-integration');
            }
            return false;
      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.21'
      - name: Install dependencies
        run: go mod download
      - name: Build binary
        if: steps.check_label.outputs.result == 'true'
        run: go build -o webscan .
      - name: Run integration harness
        if: steps.check_label.outputs.result == 'true'
        run: |
          chmod +x test/integration/run.sh || true
          ./test/integration/run.sh
