name: Headless UI Tests

on:
  workflow_dispatch: {}
  pull_request:
    types: [opened, synchronize, reopened, labeled]

jobs:
  headless-ui-tests:
    if: "github.event_name == 'workflow_dispatch' || contains(github.event.pull_request.labels.*.name, 'run-headless')"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.21'

      - name: Cache Go modules
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}

      - name: Install Xvfb
        run: sudo apt-get update && sudo apt-get install -y xvfb

      - name: Run headless UI tests
        run: bash ci/run-headless-tests.sh
