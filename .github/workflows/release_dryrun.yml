name: Release Dry-Run

on:
  workflow_dispatch: {}

jobs:
  goreleaser-dry-run:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.21'

      - name: Cache Go modules
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}

      - name: Goreleaser (dry run)
        uses: goreleaser/goreleaser-action@v3
        with:
          version: latest
          args: --snapshot --skip-publish --rm-dist

      - name: Note
        run: |
          echo "This is a dry-run. To publish artifacts, configure repo secrets (GPG key, GH_TOKEN) and remove --skip-publish/--snapshot as appropriate."
