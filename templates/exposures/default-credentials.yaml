id: default-credentials-admin
name: Default Admin Credentials
severity: high
description: Tests common default admin credentials on web login panels.
tags: [default-creds, authentication, panel]

requests:
  - method: POST
    path: /admin/login
    headers:
      Content-Type: application/x-www-form-urlencoded
    body: "username=admin&password=admin"
    matchers:
      - type: word
        words:
          - "dashboard"
          - "logout"
          - "welcome"
        part: body
        condition: or

  - method: POST
    path: /wp-login.php
    headers:
      Content-Type: application/x-www-form-urlencoded
    body: "log=admin&pwd=admin&wp-submit=Log+In&redirect_to=%2Fwp-admin%2F&testcookie=1"
    matchers:
      - type: word
        words:
          - "Dashboard"
          - "wp-admin"
        part: body
        condition: or
